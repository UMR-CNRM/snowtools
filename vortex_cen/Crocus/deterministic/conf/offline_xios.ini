###########################################################
# Job configuration for a 2d simulation on a grid with XIOS
###########################################################
# Context:
# offline: the only executable is OFFLINE.exe
# hendrixall: PGD.nc, PREP.nc and Forcing file are in Hendrix 
# namelist is on a specific path
#
# Launch command:
# mkjob -c .../vortex_cen/Crocus/deterministic/conf/offline_xios.ini
#       -f .../vortex_cen/Crocus/deterministic/jobs/surfex.job
#       -a datebegin=2020-08-01T06 dateend=2020-08-02T06


[DEFAULT]
# Common configuration for all tasks

# HPC configuration (ASK BEFORE CHANGE)
partition          = normal256
mem                = 220G
nnodes             = 2
# Do not change unless you have less than 80 lines or columns in your 2D grid
nprocs             = 80
ntasks             = 80
io_nodes           = 1
io_nproc           = 6
io_tasks           = 6
#io_companions = 6  # --> crash because "Binary groups are not supported by 'MpiBinaryIOServer' objects"

# Maximum time for simulation HH:MM:SS (Be parsimonious)
time               = 0:15:00

# Env
uenv               = uenv:test_xios.2@vernaym

# FORCING files from Hendrix
# The localisation is deduced from the following elements:
forcing_user       = fructusm
forcing_vapp       = meteo
forcing_vconf      = distributed
forcing_xpid       = bigalp250std
forcing_datebegin  = 2020-09-01 06
forcing_dateend    = 2020-11-01 06
forcing_geometry   = fullalpes
# These elements the path on Hendrix where you placed the FORCING file:
# /home/forcing_user/vortex/forcing_vapp/forcing_vconf/forcing_xpid/meteo/FORCING_geometry_datebegin_dateend.nc

# PGD.nc file from Hendrix
pgd_user           = fructusm
pgd_vapp           = Crocus
pgd_vconf          = deterministic
pgd_xpid           = bigalp_forcingstd
pgd_geometry       = fullalpes
# file is in /home/pgd_user/vortex/pgd_vapp/pgd_vconf/pgd_xpid/PGD_geometry.nc

# PREP.nc file from Hendrix
prep_user          = fructusm
prep_vapp          = Crocus
prep_vconf         = deterministic
prep_xpid          = bigalp_forcingstd
prep_geometry      = fullalpes
# file is in /home/prep_user/vortex/prep_vapp/prep_vconf/prep_xpid/PREP.geometry_YYYYMMDDHH.nc

# Forcing file is existing for the full period (not the case if simulation on several years)
io_duration        = full

# Namelist from a path
#allow_path         = True
#namelist_path      = /home/cnrm_other/cen/mrns/fructusm/SIMU_FORCING_BIG_ALP/OPTIONS_XIOS_fullalpes_mask.nam
namelist_source = OPTIONS_XIOS.nam

# Other: eXPerienceID and geometry of simulation
xpid               = template_2d_offline_xios_hendrixall
geometry           = fullalpes

# module load intel (nécessaire car XIOS par compilé avec MPI)
ldlibs             = /opt/softs/intel/2018.04/compilers_and_libraries_2018.5.274/linux/mkl/lib/intel64,/opt/softs/intel/2018.04/compilers_and_libraries_2018.5.274/linux/compiler/lib/intel64
#exesurfex = /home/cnrm_other/cen/mrns/fructusm/git/SURFEX_CEN/exe


# Specific configuration for the different tasks of the driver
# Only when differs from the default defined above
# ------------------------------------------------------------
[inittg]
# No creation of init_TG.nc because PREP.nc is on Hendrix (this is default, you can suppress this line)
climground         = False

[pgd]
# For simulation on 2D grid
pgd_2D             = True
# PGD.nc is on Hendrix, nothing more to do

[prep]
# PREP.nc is on Hendrix, nothing to do
