############################################
# Template for a semi-distributed simulation
############################################
# Context:
# exeall: ie complete simulation with PGD.exe, PREP.exe and OFFLINE.exe
# uenvall: ie namelist and executable are taken from uenv 
# Forcing file is on Hendrix, in the reanalysis folder
#
# Launch command:
# mkjob -c .../vortex_cen/Crocus/deterministic/conf/template_semidistributed_exeall_uenvall.ini
#       -f .../vortex_cen/Crocus/deterministic/jobs/surfex.job
#       -a datebegin=2020-08-01T06 dateend=2020-08-02T06


[DEFAULT]
# Common configuration for all tasks

# HPC configuration (ASK BEFORE CHANGE)
partition          = normal256
nnodes             = 1
nprocs             = dict(alp27_allslopes:80 pyr24_allslopes:80 cor2_allslopes:80 mac11_allslopes:80 vog3_allslopes:80 jur4_allslopes:80 postes:80 alp27_flat:80 pyr24_flat:80 cor2_flat:18 mac11_flat:66 jur4_flat:24 vog3_flat:15)
ntasks             = dict(alp27_allslopes:80 pyr24_allslopes:80 cor2_allslopes:80 mac11_allslopes:80 vog3_allslopes:80 jur4_allslopes:80 postes:80 alp27_flat:80 pyr24_flat:80 cor2_flat:18 mac11_flat:66 jur4_flat:24 vog3_flat:15)

# Maximum time for simulation HH:MM:SS (Be parsimonious)
time               = 0:10:00

# Env
uenv               = uenv:ref_cen.02@fructusm
namelist_source    = OPTIONS_V9_OPER.nam

# FORCING files from Hendrix
# The localisation is deduced from the following elements:
forcing_user       = vernaym
forcing_vapp       = s2m
forcing_vconf      = reanalysis
forcing_xpid       = release_2026
forcing_block      = addslopes
# These elements the path on Hendrix where you placed the FORCING file:
# /home/forcing_user/vortex/forcing_vapp/forcing_vconf/forcing_xpid/forcing_block/FORCING.geometry_datebegin_dateend.nc

# Other: eXPerienceID and geometry of simulation
xpid               = template_semidistributed_exeall_uenvall
geometry           = vog3_allslopes

[inittg]
# For the creation of init_TG.nc file from FORCING
climground         = True

[pgd]
# PGD executable from uenv
# Do not change : PGD is not parallelized
nprocs             = 1
ntasks             = 1

[prep]
# In order to get init_TG.nc file from cache: the result of [init_tg] task is in block init_tg
tg_block           = init_tg
# PREP executable from uenv
# Do not change : PREP is not parallelized
nprocs             = 1
ntasks             = 1

[offline]
# OFFLINE executable from uenv
