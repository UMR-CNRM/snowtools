forcing_block      = safran/postes

[shadows]
# The "concatenate" task store the concatenated FORCING under a 'concatenate' block by default
forcing_block      = concatenate
forcing_user       = vernaym
# Store SURFEX-ready FORCING files in a "meteo" block
out_block          = meteo

[offline]
