time               = 0:05:00
# The generation of a PGD file requires a concateanted FORCING file in geometry "postes"
forcing_block      = concatenate
forcing_user       = vernaym

[concatenation_job]
# TODO : Comprendre pourquoi ça plante avec un ntasks supérieur
ntasks = 10
nprocs = 10
time   = 0:15:00

[concatenation]
